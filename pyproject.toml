[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gitpulse-ai"
dynamic = ["version"]
description = "Analyze git repo history for development hotspots with LLM-powered insights"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "srikanth1003" },
]
keywords = [
    "git",
    "git-history",
    "code-analysis",
    "code-quality",
    "hotspots",
    "technical-debt",
    "developer-productivity",
    "llm",
    "ai",
    "coding-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    # 0.13 is the first release that accepts PEP 604 (`int | None`) option annotations.
    "typer>=0.13.0",
    "gitpython>=3.1.0",
    "litellm>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/srikanth1003/git-pulse"
Repository = "https://github.com/srikanth1003/git-pulse"
Issues = "https://github.com/srikanth1003/git-pulse/issues"

[project.scripts]
git-pulse = "git_pulse.cli:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/git_pulse/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/git_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets test helpers be imported as `tests.helpers.*` from the repo root.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's documented idiom is calls in argument defaults.
"src/git_pulse/cli.py" = ["B008"]
"src/git_pulse/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/git_pulse"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["litellm.*", "git.*"]
ignore_missing_imports = true

# Legacy modules predating the type-annotation baseline; annotated incrementally.
[[tool.mypy.overrides]]
module = ["git_pulse.collector.*", "git_pulse.cli"]
disallow_untyped_defs = false
